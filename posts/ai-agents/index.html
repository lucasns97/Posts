<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agents — from text to action</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --fog:#EDF0F4;--ink:#141E2A;--ink-soft:#46556B;
  --cobalt:#2742E8;--token:#E8920A;--alert:#D8421F;
  --card:#FFFFFF;--line:#C7CFDA;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--fog);color:var(--ink);overflow:hidden}
.deck{height:100vh;width:100vw;position:relative}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:6vh 8vw;opacity:0;transform:translateX(40px);
  transition:opacity .45s ease,transform .45s ease;pointer-events:none;overflow-y:auto;
}
.slide.active{opacity:1;transform:translateX(0);pointer-events:auto}
.slide.prev{transform:translateX(-40px)}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .2s ease;transform:none!important}}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cobalt);margin-bottom:1.2rem}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(2.2rem,6vw,4.6rem);line-height:1.05;letter-spacing:-.02em}
h2{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(1.6rem,4vw,2.8rem);line-height:1.12;letter-spacing:-.02em;margin-bottom:1.4rem}
p.lead{font-size:clamp(1rem,1.6vw,1.2rem);color:var(--ink-soft);max-width:62ch;line-height:1.65}
p.lead+p.lead{margin-top:.9rem}
strong{color:var(--ink)}.accent{color:var(--cobalt)}
.cards{display:grid;gap:1rem;margin-top:1.8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.3rem}
.card h3{font-family:'Sora',sans-serif;font-size:1rem;font-weight:600;margin-bottom:.4rem}
.card p{font-size:.92rem;color:var(--ink-soft);line-height:1.55}
.mono{font-family:'IBM Plex Mono',monospace}
.src{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-soft);margin-top:1.6rem;opacity:.75;line-height:1.6}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:.9rem 8vw;background:linear-gradient(to top,var(--fog) 60%,transparent)}
.dots{display:flex;gap:.45rem;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-soft);background:transparent;cursor:pointer;padding:0}
.dot.on{background:var(--cobalt);border-color:var(--cobalt)}
.dot:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.navbtns{display:flex;gap:.5rem;align-items:center}
.nbtn{font-family:'IBM Plex Mono',monospace;font-size:.8rem;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:.5rem .95rem;cursor:pointer}
.nbtn:hover{background:var(--ink);color:var(--fog)}
.nbtn:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.counter{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft)}
.hint{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-soft);margin-top:2.2rem}
/* lang toggle */
.lang-toggle{display:flex;gap:.4rem;align-items:center}
.lbtn{font-family:'IBM Plex Mono',monospace;font-size:.75rem;border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:8px;padding:.35rem .7rem;cursor:pointer;transition:all .2s}
.lbtn.active{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.lbtn:hover:not(.active){border-color:var(--cobalt);color:var(--cobalt)}
/* cover */
.cover-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.78rem;border:1.5px solid var(--cobalt);color:var(--cobalt);border-radius:999px;padding:.35rem .9rem;margin-bottom:1.6rem}
.cover-sub{margin-top:1.4rem}
.cover-lang{display:flex;gap:.8rem;margin-top:2rem;flex-wrap:wrap}
.lang-card{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:1rem 1.3rem;cursor:pointer;transition:border-color .25s,box-shadow .25s;min-width:160px}
.lang-card:hover,.lang-card:focus-visible{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(39,66,232,.12)}
.lang-card .lc-flag{font-size:1.5rem;margin-bottom:.4rem}
.lang-card .lc-label{font-family:'Sora',sans-serif;font-weight:600;font-size:.95rem}
.lang-card .lc-sub{font-size:.8rem;color:var(--ink-soft);margin-top:.2rem}
/* timeline */
.timeline{display:flex;flex-direction:column;gap:0;margin-top:1.6rem;border-left:2px solid var(--line);padding-left:1.4rem}
.tl-item{position:relative;padding:.55rem 0}
.tl-item::before{content:'';position:absolute;left:calc(-1.4rem - 6px);top:1rem;width:10px;height:10px;border-radius:50%;background:var(--cobalt)}
.tl-year{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--cobalt);font-weight:500}
.tl-item p{font-size:.95rem;color:var(--ink-soft);line-height:1.5;max-width:60ch}
/* loop */
.loop-wrap{display:flex;gap:3rem;align-items:center;flex-wrap:wrap;margin-top:1.5rem}
.loop-svg{flex:0 0 auto}
.loop-legend{flex:1;min-width:260px}
.loop-step{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:.85rem 1rem;margin-bottom:.7rem;cursor:pointer;transition:border-color .25s,box-shadow .25s}
.loop-step.on{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(39,66,232,.12)}
.loop-step h3{font-family:'Sora',sans-serif;font-size:.95rem;font-weight:600}
.loop-step p{font-size:.85rem;color:var(--ink-soft);margin-top:.2rem;line-height:1.5}
.formula{font-family:'IBM Plex Mono',monospace;font-size:clamp(.85rem,1.7vw,1.05rem);background:var(--ink);color:#E9EDF5;border-radius:12px;padding:1rem 1.3rem;margin-top:1.4rem;display:inline-block;line-height:1.7}
.formula b{color:#8FA2FF;font-weight:500}
/* orch */
.orch{margin-top:1.4rem}
.orch-run{font-family:'IBM Plex Mono',monospace;font-size:.85rem;border:1.5px solid var(--cobalt);background:var(--cobalt);color:#fff;border-radius:10px;padding:.6rem 1.2rem;cursor:pointer}
.orch-run:disabled{opacity:.45;cursor:default}
.orch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-top:1.1rem}
.agent{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:.8rem .9rem;transition:border-color .3s,background .3s}
.agent .a-name{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.agent .a-task{font-size:.85rem;margin-top:.3rem;line-height:1.4}
.agent .a-status{font-family:'IBM Plex Mono',monospace;font-size:.72rem;margin-top:.55rem;color:var(--ink-soft)}
.agent.working{border-color:var(--token)}.agent.working .a-status{color:var(--token)}
.agent.done{border-color:#1B9E6B}.agent.done .a-status{color:#1B9E6B}
.orch-result{font-family:'IBM Plex Mono',monospace;font-size:.85rem;margin-top:1rem;color:var(--ink);min-height:1.4em}
.orch-result a{color:var(--cobalt);font-weight:500;text-underline-offset:3px}
.orch-result a:hover{color:var(--token)}
.orch-result a:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
/* cost */
.cost-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1.6rem}
.cost-num{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(1.8rem,3.6vw,2.6rem);color:var(--token)}
.cost-num.red{color:var(--alert)}
.cost-card p{font-size:.88rem;color:var(--ink-soft);line-height:1.5;margin-top:.35rem}
.tokenbar-wrap{margin-top:1.8rem;max-width:560px}
.tokenbar-label{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);margin-bottom:.4rem;display:flex;justify-content:space-between}
.tokenbar{height:14px;border-radius:7px;background:var(--card);border:1px solid var(--line);overflow:hidden;margin-bottom:.9rem}
.tokenbar>div{height:100%;background:var(--cobalt);width:0;transition:width 1.2s ease}
.tokenbar.t15>div{background:var(--token)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.6rem}
@media(max-width:720px){.duo{grid-template-columns:1fr}}
.duo .card h3{color:var(--cobalt)}
</style>
</head>

</nav>

// ─── STATE ──────────────────────────────────────────────────────────────────
let lang = 'en';
let cur = 0;
let barsDone = false;
let loopTimer = null, loopI = 0;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ─── BUILD COVER ─────────────────────────────────────────────────────────────
function buildCover(l) {
  const t = T[l];
  return `<section class="slide${cur===0?' active':''}" data-slide="0">
  <span class="cover-tag">${t.tag}</span>
  <h1>${t.title}</h1>
  <p class="lead cover-sub">${t.subtitle}</p>
  <div class="cover-lang">
    <button type="button" class="lang-card" onclick="setLang('en')">
      <div class="lc-flag">🇺🇸</div>
      <div class="lc-label">English</div>
      <div class="lc-sub">Read in English</div>
    </button>
    <button type="button" class="lang-card" onclick="setLang('pt')">
      <div class="lc-flag">🇧🇷</div>
      <div class="lc-label">Português</div>
      <div class="lc-sub">Ler em Português</div>
    </button>
  </div>
  <p class="hint">${t.hint}</p>
</section>`;
}

function buildSlide(l, i) {
  const s = T[l].slides[i];
  if (!s) return '';
  return `<section class="slide" data-slide="${i}">
  <p class="eyebrow">${s.eyebrow}</p>
  <h2>${s.title}</h2>
  ${s.body}
</section>`;
}

function renderDeck() {
  const deck = document.getElementById('deck');
  const t = T[lang];
  let html = buildCover(lang);
  for (let i = 1; i < t.slides.length; i++) html += buildSlide(lang, i);
  deck.innerHTML = html;
  // rebuild dots
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  const total = T[lang].slides.length;
  for (let i = 0; i < total; i++) {
    const d = document.createElement('button');
    d.className = 'dot' + (i === cur ? ' on' : '');
    d.setAttribute('aria-label', 'Go to slide ' + (i + 1));
    d.onclick = () => go(i);
    dotsEl.appendChild(d);
  }
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + total;
  document.getElementById('prevBtn').setAttribute('aria-label', lang === 'pt' ? 'Slide anterior' : 'Previous slide');
  document.getElementById('nextBtn').setAttribute('aria-label', lang === 'pt' ? 'Próximo slide' : 'Next slide');
  // attach orch + loop
  attachOrch();
  // mark active
  markActive();
}

function markActive() {
  const slides = [...document.querySelectorAll('.slide')];
  slides.forEach((s, i) => {
    s.classList.remove('active', 'prev');
    if (i < cur) s.classList.add('prev');
    if (i === cur) s.classList.add('active');
  });
  const dots = [...document.querySelectorAll('.dot')];
  dots.forEach((d, i) => d.classList.toggle('on', i === cur));
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + T[lang].slides.length;
  // special slides
  const activeId = document.querySelector('.slide.active')?.id;
  if (document.querySelector('.slide.active #loopArc')) { startLoop(); } else { stopLoop(); }
  if (document.querySelector('.slide.active .tokenbar')) { animateBars(); }
}

function go(n) {
  const total = T[lang].slides.length;
  if (n < 0 || n >= total) return;
  const slides = [...document.querySelectorAll('.slide')];
  slides[cur].classList.remove('active');
  slides[cur].classList.toggle('prev', n > cur);
  cur = n;
  slides.forEach((s, i) => s.classList.toggle('prev', i < cur));
  slides[cur].classList.add('active');
  const dots = [...document.querySelectorAll('.dot')];
  dots.forEach((d, i) => d.classList.toggle('on', i === cur));
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + total;
  if (document.querySelector('.slide.active #loopArc')) startLoop(); else stopLoop();
  if (document.querySelector('.slide.active .tokenbar')) animateBars();
}

function setLang(l) {
  lang = l;
  barsDone = false;
  stopLoop(); loopI = 0;
  document.getElementById('lbtnEN').classList.toggle('active', l === 'en');
  document.getElementById('lbtnPT').classList.toggle('active', l === 'pt');
  document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en';
  document.title = l === 'pt' ? 'Agentes de IA — do texto à ação' : 'AI Agents — from text to action';
  renderDeck();
  go(cur);
}

// ─── LOOP ANIMATION ──────────────────────────────────────────────────────────
const offsets = [0, -163, -326];
function setLoopStep(i) {
  loopI = i;
  const arc = document.getElementById('loopArc');
  if (arc) arc.setAttribute('stroke-dashoffset', offsets[i]);
  [...document.querySelectorAll('.loop-step')].forEach((s, j) => s.classList.toggle('on', j === i));
}
function startLoop() {
  if (reduceMotion || loopTimer) return;
  loopTimer = setInterval(() => setLoopStep((loopI + 1) % 3), 1600);
}
function stopLoop() { clearInterval(loopTimer); loopTimer = null; }

// ─── ORCHESTRATOR DEMO ───────────────────────────────────────────────────────
function attachOrch() {
  const runBtn = document.getElementById('runOrch');
  if (!runBtn) return;
  runBtn.onclick = () => {
    runBtn.disabled = true;
    const orchResult = document.getElementById('orchResult');
    orchResult.textContent = '';
    const agents = [...document.querySelectorAll('#orchGrid .agent')];
    agents.forEach(a => {
      a.classList.remove('working', 'done');
      a.querySelector('.a-status').textContent = a.querySelector('.a-status').dataset.idle;
    });
    let t = 0;
    [0, 1, 2, 3, 4].forEach((i, k) => {
      const st = agents[i].querySelector('.a-status');
      setTimeout(() => { agents[i].classList.add('working'); st.textContent = st.dataset.working; }, t);
      t += i === 2 ? 1700 : 1000;
      setTimeout(() => { agents[i].classList.remove('working'); agents[i].classList.add('done'); st.textContent = st.dataset.done; }, t);
    });
    setTimeout(() => {
      const label = lang === 'pt' ? 'entregue' : 'delivered';
      orchResult.innerHTML = `→ ${label}: <a href="smartphone-per-gen.html" target="_blank" rel="noopener">smartphone-per-gen.html ↗</a>`;
      runBtn.disabled = false;
      runBtn.textContent = lang === 'pt' ? '↻ rodar de novo' : '↻ run again';
    }, t + 400);
  };
  // re-attach loop-step clicks
  [...document.querySelectorAll('.loop-step')].forEach(s => {
    s.onclick = () => { stopLoop(); setLoopStep(+s.dataset.i); };
  });
}

// ─── COST BARS ───────────────────────────────────────────────────────────────
function animateBars() {
  if (barsDone) return; barsDone = true;
  document.querySelectorAll('.tokenbar > div').forEach(b => {
    requestAnimationFrame(() => { b.style.width = b.dataset.w; });
  });
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
document.getElementById('nextBtn').onclick = () => go(cur + 1);
document.getElementById('prevBtn').onclick = () => go(cur - 1);
document.addEventListener('keydown', (e) => {
  const el = e.target;
  const isInteractive = el instanceof HTMLElement && (
    el.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON', 'A'].includes(el.tagName)
  );
  if (isInteractive) return;

  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === ' ') { e.preventDefault(); go(cur + 1); }
});
let tx = null;
document.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
  tx = null;
}, { passive: true });

// ─── INIT ─────────────────────────────────────────────────────────────────────
setLang('pt');
</script>
